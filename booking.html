<section class="page-header">
    <h1>Book a Table</h1>
    <p>Reserve your seat for meetings, gatherings, or quiet study time.</p>
</section>

<div class="booking-container">

    <form class="booking-form">
        <label>Name:</label>
        <input type="text" required>

        <label>Email:</label>
        <input type="email" required>

        <label>Phone Number:</label>
        <input type="text" required>

        <label>Date:</label>
        <input type="date" required>

        <label>Time:</label>
        <input type="time" required>

        <label>Number of Guests:</label>
        <input type="number" min="1" max="20" required>

        <label>Special Requests:</label>
        <textarea rows="5" placeholder="Any allergies, preferences, etc."></textarea>

        <button type="submit" class="hero-btn">Submit Booking</button>
    </form>
</div>
